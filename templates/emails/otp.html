<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Verification Code</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0; padding:0; background-color:#f4f6f8; font-family:Arial, Helvetica, sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0">
    <tr>
        <td align="center" style="padding:40px 0;">
            <table width="100%" max-width="480" cellpadding="0" cellspacing="0"
                   style="background:#ffffff; border-radius:8px; padding:32px; max-width:480px;">

                <!-- Header -->
                <tr>
                    <td align="center" style="padding-bottom:24px;">
                        <h2 style="margin:0; font-weight:500; color:#202124;">
                            Verify your email
                        </h2>
                    </td>
                </tr>

                <!-- Message -->
                <tr>
                    <td style="color:#5f6368; font-size:15px; line-height:1.6;">
                        Hi {{ user_name }},
                        <br><br>
                        Use the verification code below to complete your sign-in.
                        This code will expire in <strong>{{ expiry_minutes }} minutes</strong>.
                    </td>
                </tr>

                <!-- OTP Box -->
                <tr>
                    <td align="center" style="padding:28px 0;">
                        <div style="
                            display:inline-block;
                            padding:16px 28px;
                            font-size:28px;
                            letter-spacing:6px;
                            font-weight:600;
                            color:#1a73e8;
                            border:1px dashed #dadce0;
                            border-radius:6px;
                            background:#f8f9fa;">
                            {{ otp }}
                        </div>
                    </td>
                </tr>

                <!-- Warning -->
                <tr>
                    <td style="color:#5f6368; font-size:14px; line-height:1.6;">
                        If you didn’t request this code, you can safely ignore this email.
                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td style="padding-top:32px; color:#9aa0a6; font-size:12px;" align="center">
                        © {{ year }} YourAppName · Security Team
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>

</body>
</html>
